[project]
name = "poxiao"
version = "3.0.0"
description = "破晓 — 二十四节气安全工具链 (Dawn + FrostMoon + VernalEquinox + JingZhe + GuanXing + XiaZhi)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "dnspython>=2.6.0",
    "python-whois>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
poxiao = "src.cli:main"
frostmoon = "frostmoon:main"
vernalequinox = "vernalequinox:main"
jingzhe = "jingzhe:main"
guanxing = "guanxing:main"
xiazhi = "xiazhi:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
