[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poxiao"
version = "3.0.0"
description = "破晓 — 二十四节气安全工具链 (Dawn + FrostMoon + VernalEquinox + JingZhe + GuanXing + XiaZhi)"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{ name = "破晓主理人" }]
keywords = ["security", "scanner", "nuclei", "recon", "waf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "dnspython>=2.6.0",
    "python-whois>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.8",
]

# 仅 poxiao 主入口有确证的 main()（全仓 search 确认）；其余模块经 `poxiao <subcommand>` 调度，
# 不再注册虚假 console_scripts（原 frostmoon/...:main 入口模块不存在，会导致安装后命令不可用）。
[project.scripts]
poxiao = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 覆盖率作为指标报告（非硬门槛）；ci_audit + 测试通过才是硬门禁。
# 路线图目标 ≥60%，当前基线约 10%，随测试补齐逐步上调 fail_under。
addopts = "-ra --cov=src --cov-report=term-missing"

# mypy (P1-4 / R2)：渐进式，非 --strict。
# Phase 1 仅对核心模块做关卡（见 .github/workflows/ci.yml），
# 全仓约 150+ 处类型错误，按 R2 修订逐模块收紧，不承诺近期 --strict 零错误。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
show_error_codes = true
disallow_untyped_defs = false
