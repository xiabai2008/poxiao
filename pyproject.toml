[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poxiao"
version = "3.1.0"
description = "破晓 — 二十四节气安全工具链 (Dawn + FrostMoon + VernalEquinox + JingZhe + GuanXing + XiaZhi)"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "PoXiao contributors" }]
keywords = ["security", "scanner", "nuclei", "recon", "waf", "cve", "poc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Security :: Vulnerability Scanning",
]

dependencies = [
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "dnspython>=2.6.0",
    "python-whois>=0.9.0",
    "cryptography>=42.0.0",  # P1-C 模板签名 (ECDSA P-256)
]

[project.urls]
Homepage = "https://github.com/xiabai2008/poxiao"
Repository = "https://github.com/xiabai2008/poxiao"
Documentation = "https://github.com/xiabai2008/poxiao/blob/main/README.md"
Changelog = "https://github.com/xiabai2008/poxiao/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.15",   # E1 lint
    "bandit>=1.9",  # E2 安全扫描
]

# 仅 poxiao 主入口有确证的 main()（全仓 search 确认）；其余模块经 `poxiao <subcommand>` 调度，
# 不再注册虚假 console_scripts（原 frostmoon/...:main 入口模块不存在，会导致安装后命令不可用）。
[project.scripts]
poxiao = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 路线图目标 ≥60%；P5 覆盖率提升阶段已达成，设为硬门槛防止回归。
# 注：ci_audit + 测试全部通过仍是首要门禁，覆盖率门槛为次级保障。
addopts = "-ra --cov=src --cov-report=term-missing"

[tool.coverage.report]
fail_under = 60

# mypy (P1-4 / R2)：渐进式，非 --strict。
# Phase 1 仅对核心模块做关卡（见 .github/workflows/ci.yml），
# 全仓约 150+ 处类型错误，按 R2 修订逐模块收紧，不承诺近期 --strict 零错误。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
show_error_codes = true
disallow_untyped_defs = false

# ruff (E1)：默认规则集（E/F），保证基础正确性；全仓当前零告警
[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["build", "dist", ".git", ".mypy_cache", ".pytest_cache", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501 行长交由 formatter 处理，此处不强制
ignore = ["E501"]

# banner.py 的 ASCII 艺术图尾随空格为对齐设计，跳过 W291
[tool.ruff.lint.per-file-ignores]
"src/utils/banner.py" = ["W291"]

# bandit (E2)：skips 均为有意设计（安全设计已冻结/非安全用途），
# 有争议项（SQL 拼接/urlopen/pycryptodome 误报）在代码处以 # nosec 标注
[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".git"]
skips = [
    "B110",  # try/except pass — 扫描器容错设计（不阻断）
    "B112",  # try/except continue — 同上
    "B311",  # random 用于 UA 轮换/随机串/抖动，非密码学用途
    "B105",  # 空字符串默认值/占位符被误报为硬编码密码
    "B107",  # 变量名为 secrets/token 的默认参数误报
    "B104",  # 有意绑定 0.0.0.0（oast 回调/proxy 服务器，文档已声明）
    "B324",  # MD5/SHA1 用于内容指纹与降噪，非安全用途
    "B501",  # verify=False — CONTEXT.md R1 冻结（内网/自签），redline 启动告警兜底
]
