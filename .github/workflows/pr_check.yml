name: PR Check (模板贡献 / 数据治理)

on:
  pull_request:
    paths:
      - "templates/**"
      - "src/dawn/cve_match.py"
      - "tools/**"
      - ".github/workflows/pr_check.yml"

# 权限最小化：仅读取与写检查状态
permissions:
  contents: read
  checks: write

jobs:
  template-and-data-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库布局守卫：禁止嵌套 poxiao/ 副本复发（Phase 1 仓库抢救，2026-08）
      - name: Repo layout guard (no nested poxiao/ copy)
        run: |
          if [ -d poxiao ]; then
            echo "::error::检测到嵌套 poxiao/ 目录 — 仓库只允许根目录单套副本，请勿重新引入"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          python -m pip install -e . || true   # 非必须，仅确保工具可导入

      - name: 模板 schema 校验（template_sync validate）
        # 失败条件：YAML 损坏 / 缺必填字段 / id 撞号（守 X1，计数不判失败）
        run: python tools/template_sync.py validate templates

      - name: 数据治理硬门禁（ci_audit）
        # 撞号 / 字段缺失 / YAML 损坏 才失败；CVE/模板数量仅作指标
        run: python tools/ci_audit.py
