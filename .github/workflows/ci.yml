name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Data Governance Audit + Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CVE / Template governance audit (hard gate)
        run: python tools/ci_audit.py

      - name: Run tests with coverage (metric)
        run: python -m pytest

  type-check:
    name: mypy core modules (P1-4 / R2, phased)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 渐进式关卡：仅对 curated 模块做 mypy 校验（非 --strict）。
      # 模块列表由 tools/type_check.py 单一事实来源维护（含 Phase 3 扩展）。
      # 全仓约 150+ 处类型错误，按 R2 修订逐模块收紧，不承诺近期 --strict 零错误。
      - name: mypy on curated modules (hard gate, P1-4 / P3-3)
        run: python tools/type_check.py

  lint-sec:
    name: ruff lint + bandit security (E1 / E2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff + bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit

      - name: ruff check (hard gate)
        run: python -m ruff check src/ tools/ *.py

      - name: bandit security scan (hard gate, skips 见 pyproject [tool.bandit])
        run: python -m bandit -r src/ tools/ -c pyproject.toml

  build-wheel:
    name: Build wheel (P4-1 / M4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel installable + console script
        run: |
          python -m pip install dist/*.whl
          poxiao --help
